    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f2a44, #3b4d7a, #6a7fc2);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 0 24px;
            letter-spacing: 1px;
        }

        .card2 {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 32px 26px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            color: #edf3ff;
        }

        .card2 input {
            width: 100%;
            padding: 14px 14px;
            margin: 8px 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .card2 input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .card2 input:focus {
            border-color: #9ec5ff;
            box-shadow: 0 0 0 3px rgba(158, 197, 255, 0.25);
        }

        .card2 button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7dd3fc, #3b82f6);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(59, 130, 246, 0.45);
        }

        .card2 button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(59, 130, 246, 0.55);
        }

        #pwText {
            margin-top: 18px;
            text-align: center;
            min-height: 24px;
            font-weight: 600;
            color: #dff5ff;
        }
    </style>
</head>
